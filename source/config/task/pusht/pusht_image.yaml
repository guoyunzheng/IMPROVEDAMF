name: pusht_image

image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

action_dim: 2
crop_shape: [84, 84]

env_runner:
  _target_: source.env_runner.pusht_image_runner.PushTImageRunner
  abs_action: False
  disturbance_force: 0.0 # disabled; try 10-100 for a mild constant drift
  n_train: 0
  n_train_vis: 0
  train_start_seed: 0
  n_test: 50
  n_test_vis: 0
  legacy_test: True
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null
  save_trajectories: False
  trajectory_dir: trajectories

dataset:
  _target_: source.dataset.pusht_image_dataset.PushTImageDataset
  zarr_path: data/demos/pusht/pusht_cchi_v7_replay.zarr
  abs_action: False
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${n_obs_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: 90

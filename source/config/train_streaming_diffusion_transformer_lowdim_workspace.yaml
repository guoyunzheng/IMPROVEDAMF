# Config for lowdim Streaming Diffusion with an Adaptive Mean Flow-style transformer architecture.

defaults:
  - _self_
  - task: pusht/pusht_lowdim

name: train_streaming_diffusion_transformer_lowdim
_target_: source.workspace.train_streaming_diffusion_transformer_lowdim_workspace.TrainStreamingDiffusionTransformerLowdimWorkspace

task_name: ${task.name}
obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
pred_action_steps_only: False

policy:
  _target_: source.policy.streaming_diffusion_transformer_lowdim_policy.StreamingDiffusionTransformerLowdimPolicy

  obs_dim: ${obs_dim}
  action_dim: ${action_dim}

  noise_scheduler:
    _target_: source.model.streaming_diffusion.schedulers.DDIMStreamingDiffusionScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 16
  obs_as_global_cond: ${obs_as_global_cond}

  # Transformer architecture params, matched to Adaptive Mean Flow lowdim transformer.
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.2
  causal_attn: True
  time_cond: cat

  # Streaming Diffusion noise regime params, matched to Streaming Diffusion lowdim UNet.
  temporally_constant_weight: 0.2
  temporally_increasing_weight: 0.0
  temporally_random_weights: 0.0
  chunk_wise_weight: 0.8
  buffer_init: zero

inference_sweep:
  perform_inference_sweep: False
  sweep_param_dict: {}

ema:
  _target_: source.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  transformer_weight_decay: 1.0e-3
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 501
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 25
  last_n_rollout_every:
    interval: ${training.rollout_every}
    n: 100
  checkpoint_every: 25
  val_every: 25
  sample_every: 25
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: adaptive_mean_flow
  resume: True
  mode: offline
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: epoch
    mode: max
    k: 0
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

parent_dir: streaming_diffusion_transformer
hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${parent_dir}/_${name}_${training.seed}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}

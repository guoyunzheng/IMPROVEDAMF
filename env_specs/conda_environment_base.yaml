# Create: CONDA_CHANNEL_PRIORITY=flexible conda env create -f env_specs/conda_environment_base.yaml
# After activation, run: bash scripts/repair_itt_runtime.sh
name: amf
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip=22.2.2
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - numpy=1.23.3
  - numba==0.56.4
  - scipy==1.9.1
  - py-opencv=4.6.0
  - cffi=1.15.1
  - matplotlib=3.6.1
  - zarr=2.12.0
  - numcodecs=0.10.2
  - h5py=3.7.0
  - hydra-core=1.2.0
  - einops=0.4.1
  - tqdm=4.64.1
  - dill=0.3.5.1
  - scikit-video=1.1.11
  - scikit-image=0.19.3
  - gym=0.21.0
  - pymunk=6.2.1
  - wandb=0.13.3
  - threadpoolctl=3.1.0
  - shapely=1.8.4
  - cython=0.29.32
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - termcolor=2.0.1
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - psutil=5.9.2
  - click=8.0.4
  - accelerate=0.13.2
  - datasets=2.6.1
  - diffusers=0.32.2
  - av=10.0.0
  - cmake=3.24.3
  # trick to avoid cpu affinity issue described in https://github.com/pytorch/pytorch/issues/99625
  - llvm-openmp=14
  # Link its static library with scripts/repair_itt_runtime.sh when needed.
  - ittapi-static=3.28.0
  # trick to force reinstall imagecodecs via pip
  - imagecodecs==2022.8.8
  - pip:
    - pygame==2.1.2
    # pip package required for jpeg-xl
    - imagecodecs==2022.9.26
    - numpy==1.23.3
    # Compatibility fixes verified during the Ubuntu 20.04 server deployment.
    - sympy==1.13.1
    - mpmath==1.3.0
    - multiprocess==0.70.13
    - setuptools==80.9.0
